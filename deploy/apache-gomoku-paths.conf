# Included from inside the aeonthic.com HTTPS VirtualHost.

RedirectMatch 301 ^/gomoku$ /gomoku/
RedirectMatch 301 ^/gomoku_match$ /gomoku_match/

# Public visitors must not be able to stop either native process. The longer
# route and exclusions must appear before their broader ProxyPass routes.
ProxyPass "/gomoku_match/api/match/quit" "!"
ProxyPass "/gomoku_match/" "http://127.0.0.1:18900/" connectiontimeout=5 timeout=1800
ProxyPassReverse "/gomoku_match/" "http://127.0.0.1:18900/"

ProxyPass "/gomoku/api/quit" "!"
ProxyPass "/gomoku/" "http://127.0.0.1:18899/" connectiontimeout=5 timeout=1800
ProxyPassReverse "/gomoku/" "http://127.0.0.1:18899/"
